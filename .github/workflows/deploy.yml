name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: '.'
          wranglerVersion: '4'
          # wrangler.jsonc is read for config; secrets stay in the Cloudflare dashboard.
          # To rotate secrets, use `wrangler secret put NAME` from a machine with
          # wrangler CLI logged in, or set them via the Cloudflare dashboard.

      - name: Set worker secrets from GitHub Actions secrets
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: af8966f7e79e83ed3315b1de46bb7946
          CF_WORKER_NAME: amb-ui-auth
          # GitHub-side secrets. Only GH_APP_CLIENT_ID, GH_APP_CLIENT_SECRET,
          # and APP_SLUG are required; ALLOWED_ORIGIN has a default in wrangler.jsonc.
          # Note: 'GITHUB_*' is reserved by GitHub Actions — we use 'GH_APP_*'.
          SECRET_GITHUB_APP_CLIENT_ID:     ${{ secrets.GH_APP_CLIENT_ID }}
          SECRET_GITHUB_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
          SECRET_APP_SLUG:                 ${{ secrets.APP_SLUG }}
        run: |
          set -euo pipefail
          echo "▸ Setting Cloudflare worker secrets..."
          npx --yes wrangler@4 secret put GITHUB_APP_CLIENT_ID     --name "$CF_WORKER_NAME" <<< "$SECRET_GITHUB_APP_CLIENT_ID"
          npx --yes wrangler@4 secret put GITHUB_APP_CLIENT_SECRET --name "$CF_WORKER_NAME" <<< "$SECRET_GITHUB_APP_CLIENT_SECRET"
          npx --yes wrangler@4 secret put APP_SLUG                 --name "$CF_WORKER_NAME" <<< "$SECRET_APP_SLUG"
          echo "▸ Secrets set. Worker will pick them up on the next request."